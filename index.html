<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>DOGS 4 US</title>
</head>
<body>
    <div class="dog__card">
        <img src="./Assets-1/picture-corgi.jpg" alt="Corgi">
        <h3>Corgi</h3>
        <p>Meet the adorable and playful Corgi</p>
    </div>
    <header>
        <nav>
            <h2>DOGS 4 US</h2>
            <a href="#breeds">Find Your Dog</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="home">
            <h1>Find Your Perfect Dog</h1>
            <p>Explore different dog breeds and find the right companion for you!</p>
        </section>
        <section id="breeds">
            <h2>Explore Dog Breeds</h2>
            <p>Compare small medium and large dogs</p>
            <div class="dog-categories">
                <section class="small-dogs">
                    <h3>Small Dogs</h3>
                </section>
                <section class="medium-dogs">
                    <h3>Medium Dogs</h3>
                </section>
                <section class="large-dogs">
                    <h3>Large Dogs</h3>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
